name: Zibno iOS Build Check

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: zibno-ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator-build:
    name: Build for iOS Simulator
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Zibno customization repo
        uses: actions/checkout@v4

      - name: Read pinned upstream commit
        id: upstream
        shell: bash
        run: echo "sha=$(tr -d '\n' < UPSTREAM_COMMIT)" >> "$GITHUB_OUTPUT"

      - name: Clone WooCommerce iOS
        shell: bash
        run: |
          git clone --filter=blob:none https://github.com/woocommerce/woocommerce-ios.git upstream
          cd upstream
          git checkout "${{ steps.upstream.outputs.sha }}"

      - name: Apply Zibno patch
        shell: bash
        run: |
          cd upstream
          sed '/^diff --git a\/WooCommerce\/StoreWidgets\/StoreWidgetTheme.swift/,$d' \
            "$GITHUB_WORKSPACE/patches/zibno.patch" > /tmp/zibno-branding.patch
          git apply --check /tmp/zibno-branding.patch
          git apply /tmp/zibno-branding.patch
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
              Path("WooCommerce/StoreWidgets/StoreWidgetTheme.swift"): (
                  "return Color(.accent)", "return Color(uiColor: .accent)"
              ),
              Path("WooCommerce/StoreWidgets/Homescreen/View+ContainerBackground.swift"): (
                  "return Color(.brand)", "return Color(uiColor: .brand)"
              ),
          }
          for path, (old, new) in replacements.items():
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f"Expected compatibility target not found in {path}: {old}")
              path.write_text(text.replace(old, new, 1))
          PY

      - name: Install native dependency
        run: brew install xz

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          working-directory: upstream
          bundler-cache: true

      - name: Install project dependencies
        working-directory: upstream
        run: bundle exec rake dependencies

      - name: Build WooCommerce scheme without signing
        working-directory: upstream
        shell: bash
        run: |
          set -o pipefail
          set +e
          xcodebuild \
            -workspace WooCommerce.xcworkspace \
            -scheme WooCommerce \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee "$GITHUB_WORKSPACE/zibno-xcodebuild.log"
          status=${PIPESTATUS[0]}
          grep -E -i '(^|: )(error:|fatal error:)|BUILD FAILED|The following build commands failed|xcodebuild: error:' \
            "$GITHUB_WORKSPACE/zibno-xcodebuild.log" > "$GITHUB_WORKSPACE/zibno-errors.log" || true
          echo '===== ZIBNO XCODE ERRORS ====='
          cat "$GITHUB_WORKSPACE/zibno-errors.log" || true
          exit $status

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zibno-build-diagnostics
          path: |
            zibno-xcodebuild.log
            zibno-errors.log
          if-no-files-found: warn
          retention-days: 7
